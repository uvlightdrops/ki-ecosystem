[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-ecosystem"
version = "0.1.0"
description = "KI System - unified ecosystem stack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KI Team"}]

dependencies = [
    # Core orchestrator
    "ki-core>=0.1.0a1",
    # Config management (independent, can be used standalone)
    "yaml-cfg-wizard>=0.2.0",
    # App CLIs
    "kicli-code-assist>=0.1.0",
    "ki-knowledge>=0.1.0",
    # Supporting tools (installed by siblings)
    "widgetkit>=0.1.0",
    "widgetkit-django>=0.1.0",
    # Common dependencies
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pip-audit>=2.7.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
audit = ["pip-audit>=2.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ki_ecosystem"]

[tool.stackctl]
# All ecosystem projects as siblings
# Each app project has its own config_loader for deployment
# ki-ecosystem coordinates: init, install, update, run
# Actual deployment happens in individual app repositories
[[tool.stackctl.siblings]]
name = "ki-core"
path = "ki-core"
url = "https://github.com/uvlightdrops/ki-core.git"

[[tool.stackctl.siblings]]
name = "kicli-code-assist"
path = "kicli-code-assist"
url = "https://github.com/uvlightdrops/kicli-code-assist.git"

[[tool.stackctl.siblings]]
name = "ki-knowledge"
path = "ki-knowledge"
url = "https://github.com/uvlightdrops/ki-knowledge.git"

[[tool.stackctl.siblings]]
name = "yaml-cfg-wizard"
path = "yaml_cfg_wizard"
url = "https://github.com/uvlightdrops/yaml-cfg-wizard.git"

[[tool.stackctl.siblings]]
name = "widgetkit"
path = "widgetkit"
url = "https://github.com/uvlightdrops/widgetkit.git"

[[tool.stackctl.siblings]]
name = "widgetkit-django"
path = "widgetkit-django"
url = "https://github.com/uvlightdrops/widgetkit-django.git"

[[tool.stackctl.siblings]]
name = "yaml-cfg-wizard-ui"
path = "yaml_cfg_wizard_ui"
url = "https://github.com/uvlightdrops/yaml-cfg-wizard-ui.git"


